<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Mayank Tiwari</title>
  <desc id="d">AI full-stack developer and motion designer. I build AI products that ship, and the motion that makes them feel alive.</desc>
  <style>
    .bg { fill: #FBF7F0; }
    .grid { stroke: #E9DFD0; stroke-width: 1; }
    .name { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1E1914; letter-spacing: -1.5px; }
    .role { font: 500 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #A86A12; }
    .line { font: 400 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5C5246; }
    .mono { font: 500 15px 'Cascadia Code', Consolas, 'SFMono-Regular', monospace; fill: #7A6E5F; letter-spacing: 1px; }
    .rule { stroke: #C98A2E; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 476; stroke-dashoffset: 476; animation: draw 1.4s cubic-bezier(.22,1,.36,1) .3s forwards; }
    .rise { opacity: 0; transform: translateY(14px); animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    .r1 { animation-delay: .1s; } .r2 { animation-delay: .45s; } .r3 { animation-delay: .7s; } .r4 { animation-delay: .95s; }
    .pulse { fill: #3E9A47; transform-origin: 912px 262px; animation: pulse 2.4s ease-in-out infinite; }
    .orbit { fill: none; stroke: #D9CDBB; stroke-width: 1.5; }
    .dot { fill: #E8A33D; transform-origin: 1010px 160px; animation: spin 14s linear infinite; }
    .dot2 { fill: #1E1914; transform-origin: 1010px 160px; animation: spin 22s linear infinite reverse; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rule, .rise, .pulse, .dot, .dot2 { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; } }
  </style>
  <rect class="bg" width="1200" height="320" rx="18"/>
  <g opacity=".55">
    <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M840 0V320M920 0V320M1000 0V320M1080 0V320M1160 0V320"/>
  </g>
  <circle class="orbit" cx="1010" cy="160" r="92"/>
  <circle class="orbit" cx="1010" cy="160" r="54"/>
  <circle cx="1010" cy="160" r="16" fill="#E8A33D"/>
  <circle class="dot" cx="1010" cy="68" r="7"/>
  <circle class="dot2" cx="1010" cy="106" r="4.5"/>

  <text class="mono rise r1" x="64" y="70">LUCKNOW, INDIA · OPEN TO FREELANCE &amp; CONTRACT WORK</text>
  <text class="name rise r2" x="60" y="150">Mayank Tiwari</text>
  <line class="rule" x1="64" y1="172" x2="538" y2="172"/>
  <text class="role rise r3" x="64" y="214">AI full-stack developer &amp; motion designer</text>
  <text class="line rise r4" x="64" y="252">I build AI products that ship, and the motion that makes them feel alive.</text>
  <circle class="pulse" cx="912" cy="262" r="6"/>
  <text class="mono rise r4" x="928" y="267">AVAILABLE NOW</text>
</svg>

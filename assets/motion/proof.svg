<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Winner of LovHack Season 2 with PARITY. Rank 6 national finalist at AMPlified Season 1. 14 plus products shipped. Green CI builds on every push.">
<title>Winner of LovHack Season 2 with PARITY. Rank 6 national finalist at AMPlified Season 1. 14 plus products shipped. Green CI builds on every push.</title>
<style>

.card { fill: #16130F; stroke: #2E271F; stroke-width: 1.5; }
.edge { fill: none; stroke: #E8A33D; stroke-width: 1.5; stroke-dasharray: 120 900; stroke-dashoffset: 0; opacity: .8; animation: edge 6s linear infinite; }
.tile { opacity: 0; animation: up .9s cubic-bezier(.22,1,.36,1) forwards; }
.big { font: 800 34px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F4EDE2; letter-spacing: -.5px; }
.lab { font: 600 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #E8A33D; }
.sub { font: 400 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8C8173; }
.track { fill: none; stroke: #3A3128; stroke-width: 5; }
.arc { fill: none; stroke: #E8A33D; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 138; stroke-dashoffset: 138; animation: arc 1.6s cubic-bezier(.22,1,.36,1) forwards; }
.bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.34,1.56,.64,1) forwards; }
.tick { fill: none; stroke: #7BC47F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: arc .9s cubic-bezier(.22,1,.36,1) forwards; }
.bob { transform-box: fill-box; transform-origin: center bottom; animation: bob 3s ease-in-out infinite; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes edge { to { stroke-dashoffset: -1020; } }
@keyframes arc { to { stroke-dashoffset: 26; } }
.tick { animation-name: tick; }
@keyframes tick { to { stroke-dashoffset: 0; } }
@keyframes grow { to { transform: scaleY(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-3deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .2; } 50% { transform: scale(1.2); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>

